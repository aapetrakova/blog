<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <section class="my-navigation">
      <nav class="navbar navbar-expand-lg bg-body-tertiary"  data-bs-theme="dark">
          <div class="container-fluid">
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                  <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarSupportedContent">
                  <div class="navbar-nav me-auto mb-2 mb-lg-0">
                      <a class="nav-link active" aria-current="page" href="{% url 'main_page' %}">Главная</a>
                  </div>
            </div>
          </div>
      </nav>
</section>


    {% load static %}
<section class="my-carousel">
  <div id="carouselExampleCaptions" class="carousel slide" data-ride="carousel">
    <div class="carousel-inner">
        <div class="carousel-item active" style="background-color: #343a40!important">
            <div class="carousel-caption d-none d-md-block">
                <h1>
                  {% if post.h1 %}
                    {{ post.h1 }}
                  {% else %}
                    {{ title }}
                  {% endif %}
                </h1>
            </div>
        </div>
    </div>
  </div>
</section>

    {% block content %}{% endblock %}

    {% block pagination %}{% endblock %}

    <section class="my-footer mt-3">
        <nav class="footer footer-expand-lg bg-body-tertiary" data-bs-theme="dark">
            <div class="container">
            <div class="row">
              <div class="col-lg-9 col-sm-12 my-3">
                <span class="text-body-secondary">Блог для <s>любимого</s> тп</span>
              </div>
              <div class="col-lg-3 col-sm-12 my-3 d-flex justify-content-end">
                <ul class="nav list-unstyled">
                  <li class="ms-2"><a class="text-end" href="#">Наверх</a></li>
                </ul>
              </div>
            </div>
          </div>
        </nav>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
  </body>
</html>
